services:
  mongodb:
    image: mongo:7
    container_name: satsa-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: satsa
      MONGO_INITDB_ROOT_USERNAME: satsa
      MONGO_INITDB_ROOT_PASSWORD: satsa_dev_2026
    volumes:
      - satsa_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  satsa_mongo_data:
